[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hiper-sdk"
version = "0.1.0"
description = "Cliente Python para a API personalizada (e-commerce) do Hiper Gestão"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6", "pyjwt>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["hiper_sdk*"]
